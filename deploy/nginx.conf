# Site de démonstration statique. /healthz sert au contrôle de santé de
# dev-deploy.sh (et au HEALTHCHECK de l'image) sans dépendre du contenu du site.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type application/json;
        access_log off;
        return 200 '{"status":"ok"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
